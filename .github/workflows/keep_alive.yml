name: Keep Streamlit Alive

on:
  schedule:
    # 每 5 分钟 ping 一次（GitHub Actions 最短间隔），避免免费版应用空闲休眠
    - cron: '*/5 * * * *'
  # 支持在 GitHub 页面手动点击按钮触发测试
  workflow_dispatch:

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Ping pim999 Streamlit App
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://pim999.streamlit.app/)
          echo "HTTP status: $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Ping 返回状态码 $code，应用可能仍在唤醒中或出现异常"
          fi
