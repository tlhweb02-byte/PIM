name: 部署到香港服务器

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只跑一个部署，新的排队等待，不会互相打断
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 运行测试（不通过就不部署）
        run: python -m unittest test_expand test_pages test_excel_titles

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 通过受限 SSH 密钥触发服务器部署
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::warning::尚未配置 DEPLOY_* Secrets，跳过部署（见 DEPLOYMENT_GUIDE.md）"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # 服务器端已把这把密钥限制为只能运行 pim-deploy，这里不需要指定命令
          ssh -T -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" \
              -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes \
              root@"$DEPLOY_HOST"
